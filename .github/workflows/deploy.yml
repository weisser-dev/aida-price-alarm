name: Deploy AIDA price alarm

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Server layout
      DEPLOY_DIR: /opt/aida-price-alarm
      PROJECT: aida-price-alarm
      BACKUP_DIR: /opt/backups/aida

      # App config (non-secret)
      APP_PORT: '3000'
      APP_BASE_URL: https://aida.weisser.dev
      USE_MOCK: 'true'
      AIDA_API_URL: ''

      # SMTP via Strato (non-secret parts)
      SMTP_HOST: smtp.strato.de
      SMTP_PORT: '465'
      SMTP_SECURE: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate dependencies install
        run: npm ci

      - name: Create deployment archive
        run: |
          tar czf aida-deploy.tgz \
            src public package.json package-lock.json \
            Dockerfile .dockerignore docker-compose.yml

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "aida-deploy.tgz"
          target: "/tmp"

      - name: Deploy on server with SQLite backup
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          PROJECT: ${{ env.PROJECT }}
          BACKUP_DIR: ${{ env.BACKUP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
          APP_BASE_URL: ${{ env.APP_BASE_URL }}
          USE_MOCK: ${{ env.USE_MOCK }}
          AIDA_API_URL: ${{ env.AIDA_API_URL }}
          SMTP_HOST: ${{ env.SMTP_HOST }}
          SMTP_PORT: ${{ env.SMTP_PORT }}
          SMTP_SECURE: ${{ env.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR,PROJECT,BACKUP_DIR,APP_PORT,APP_BASE_URL,USE_MOCK,AIDA_API_URL,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS
          script: |
            set -e

            # Strato erfordert From == authentifizierter Benutzer.
            export SMTP_FROM="AIDA Preisalarm <${SMTP_USER}>"

            # ---- SQLite backup (skip if no existing DB) ----
            if [ -f "$DEPLOY_DIR/data/aida.db" ]; then
              echo "Creating SQLite backup via online .backup…"
              sudo mkdir -p "$BACKUP_DIR"
              TS=$(date +"%Y%m%d_%H%M%S")
              sudo docker run --rm \
                -v "$DEPLOY_DIR/data:/data:ro" \
                -v "$BACKUP_DIR:/backup" \
                alpine:3.20 sh -lc "apk add --no-cache sqlite >/dev/null && sqlite3 /data/aida.db \".backup '/backup/aida_${TS}.db'\" && gzip -9 /backup/aida_${TS}.db"

              # Keep last 10 backups
              cd "$BACKUP_DIR"
              ls -1t aida_*.db.gz 2>/dev/null | tail -n +11 | xargs -r rm -f || true
              cd - >/dev/null
              echo "Backup completed: $BACKUP_DIR/aida_${TS}.db.gz"
            else
              echo "No existing database at $DEPLOY_DIR/data/aida.db — skipping backup."
            fi

            # ---- Stop the old stack ----
            sudo mkdir -p "$DEPLOY_DIR"
            if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              ( cd "$DEPLOY_DIR" && sudo docker compose -p "$PROJECT" down --remove-orphans ) || true
            fi

            # ---- Stage out persistent data, replace deploy dir ----
            STAGING="$(mktemp -d)"
            if [ -d "$DEPLOY_DIR/data" ]; then sudo mv "$DEPLOY_DIR/data" "$STAGING/data"; fi

            sudo rm -rf "$DEPLOY_DIR"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo tar xzf /tmp/aida-deploy.tgz -C "$DEPLOY_DIR"

            if [ -d "$STAGING/data" ]; then sudo rm -rf "$DEPLOY_DIR/data"; sudo mv "$STAGING/data" "$DEPLOY_DIR/data"; fi
            sudo rm -rf "$STAGING"

            # data dir muss vom non-root "node" user (uid 1000) im Container schreibbar sein.
            sudo mkdir -p "$DEPLOY_DIR/data"
            sudo chown -R 1000:1000 "$DEPLOY_DIR/data"

            cd "$DEPLOY_DIR"
            sudo -E docker compose -p "$PROJECT" up -d --build --remove-orphans

            sudo docker image prune -f
            echo "Deployment completed successfully!"
