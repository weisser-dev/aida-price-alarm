name: Deploy AIDA price alarm

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine deployment target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=prod"                                       >> "$GITHUB_OUTPUT"
            echo "profile=prod"                                   >> "$GITHUB_OUTPUT"
            echo "deploy_dir=/opt/aida-price-alarm/prod"          >> "$GITHUB_OUTPUT"
            echo "project=aida-price-alarm-prod"                  >> "$GITHUB_OUTPUT"
            echo "app_port_value=3000"                            >> "$GITHUB_OUTPUT"
            echo "backup_dir=/opt/backups/aida"                   >> "$GITHUB_OUTPUT"
            echo "needs_backup=true"                              >> "$GITHUB_OUTPUT"
          else
            echo "env=dev"                                        >> "$GITHUB_OUTPUT"
            echo "profile=dev"                                    >> "$GITHUB_OUTPUT"
            echo "deploy_dir=/opt/aida-price-alarm/dev"           >> "$GITHUB_OUTPUT"
            echo "project=aida-price-alarm-dev"                   >> "$GITHUB_OUTPUT"
            echo "app_port_value=3000"                            >> "$GITHUB_OUTPUT"
            echo "backup_dir=/opt/backups/aida"                   >> "$GITHUB_OUTPUT"
            echo "needs_backup=false"                             >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Validate dependencies install
        run: npm ci

      - name: Create deployment archive
        run: |
          tar czf aida-deploy.tgz \
            src public package.json package-lock.json \
            Dockerfile .dockerignore docker-compose.yml

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "aida-deploy.tgz"
          target: "/tmp"

      # ------- DEV / non-main: deploy without backup -------
      - name: Deploy on server without SQLite backup (non-main branches)
        if: steps.target.outputs.needs_backup == 'false'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR='${{ steps.target.outputs.deploy_dir }}'
            PROJECT='${{ steps.target.outputs.project }}'
            PROFILE='${{ steps.target.outputs.profile }}'
            export APP_PORT='${{ steps.target.outputs.app_port_value }}'
            export PROFILE

            sudo mkdir -p "$DEPLOY_DIR"

            # Stop the old stack if it exists
            if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              ( cd "$DEPLOY_DIR" && sudo docker compose -p "$PROJECT" --profile "$PROFILE" down --remove-orphans ) || true
            fi

            # Preserve persistent data and operator-managed .env across redeploys
            STAGING="$(mktemp -d)"
            if [ -d "$DEPLOY_DIR/data" ]; then sudo mv "$DEPLOY_DIR/data" "$STAGING/data"; fi
            if [ -f "$DEPLOY_DIR/.env" ];  then sudo mv "$DEPLOY_DIR/.env"  "$STAGING/.env"; fi

            sudo rm -rf "$DEPLOY_DIR"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo tar xzf /tmp/aida-deploy.tgz -C "$DEPLOY_DIR"

            if [ -d "$STAGING/data" ]; then sudo rm -rf "$DEPLOY_DIR/data"; sudo mv "$STAGING/data" "$DEPLOY_DIR/data"; fi
            if [ -f "$STAGING/.env" ];  then sudo mv "$STAGING/.env" "$DEPLOY_DIR/.env"; fi
            sudo rm -rf "$STAGING"

            cd "$DEPLOY_DIR"
            sudo -E docker compose -p "$PROJECT" --profile "$PROFILE" up -d --build --remove-orphans
            sudo docker image prune -f

      # ------- PROD / main: backup + deploy -------
      - name: Deploy on server with SQLite backup (main branch)
        if: steps.target.outputs.needs_backup == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR='${{ steps.target.outputs.deploy_dir }}'
            PROJECT='${{ steps.target.outputs.project }}'
            PROFILE='${{ steps.target.outputs.profile }}'
            BACKUP_DIR='${{ steps.target.outputs.backup_dir }}'
            export APP_PORT='${{ steps.target.outputs.app_port_value }}'
            export PROFILE

            # ---- SQLite backup (skip if no existing DB) ----
            if [ -f "$DEPLOY_DIR/data/aida.db" ]; then
              echo "Creating SQLite backup via online .backup…"
              sudo mkdir -p "$BACKUP_DIR"
              TS=$(date +"%Y%m%d_%H%M%S")
              sudo docker run --rm \
                -v "$DEPLOY_DIR/data:/data:ro" \
                -v "$BACKUP_DIR:/backup" \
                alpine:3.20 sh -lc "apk add --no-cache sqlite >/dev/null && sqlite3 /data/aida.db \".backup '/backup/aida_${TS}.db'\" && gzip -9 /backup/aida_${TS}.db"

              # Keep last 10 backups
              cd "$BACKUP_DIR"
              ls -1t aida_*.db.gz 2>/dev/null | tail -n +11 | xargs -r rm -f || true
              cd - >/dev/null
              echo "Backup completed: $BACKUP_DIR/aida_${TS}.db.gz"
            else
              echo "No existing database at $DEPLOY_DIR/data/aida.db — skipping backup."
            fi

            # ---- Deploy new version ----
            echo "Deploying new version…"
            sudo mkdir -p "$DEPLOY_DIR"
            if [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              ( cd "$DEPLOY_DIR" && sudo docker compose -p "$PROJECT" --profile "$PROFILE" down --remove-orphans ) || true
            fi

            STAGING="$(mktemp -d)"
            if [ -d "$DEPLOY_DIR/data" ]; then sudo mv "$DEPLOY_DIR/data" "$STAGING/data"; fi
            if [ -f "$DEPLOY_DIR/.env" ];  then sudo mv "$DEPLOY_DIR/.env"  "$STAGING/.env"; fi

            sudo rm -rf "$DEPLOY_DIR"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo tar xzf /tmp/aida-deploy.tgz -C "$DEPLOY_DIR"

            if [ -d "$STAGING/data" ]; then sudo rm -rf "$DEPLOY_DIR/data"; sudo mv "$STAGING/data" "$DEPLOY_DIR/data"; fi
            if [ -f "$STAGING/.env" ];  then sudo mv "$STAGING/.env" "$DEPLOY_DIR/.env"; fi
            sudo rm -rf "$STAGING"

            cd "$DEPLOY_DIR"
            sudo -E docker compose -p "$PROJECT" --profile "$PROFILE" up -d --build --remove-orphans

            sudo docker image prune -f
            echo "Deployment completed successfully!"
