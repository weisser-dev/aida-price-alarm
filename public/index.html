<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AIDA Preisalarm</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>AIDA Preisalarm</h1>
    <nav>
      <button data-view="cruises" class="active">Reisen</button>
      <button data-view="routes">Routen</button>
      <button data-view="promotions">Aktionen</button>
      <button data-view="watchlist">Meine Merkliste</button>
    </nav>
  </header>

  <main>
    <section id="view-cruises">
      <form id="filters" class="filters">
        <div class="row">
          <input type="search" name="q" placeholder="Suche nach Reise, Schiff, Region oder Hafen…" />
          <select name="ship"><option value="">Alle Schiffe</option></select>
          <select name="destination"><option value="">Alle Regionen</option></select>
        </div>
        <div class="row">
          <label class="inline">Abfahrt von <input type="date" name="departsFrom" /></label>
          <label class="inline">bis <input type="date" name="departsTo" /></label>
          <select name="flight">
            <option value="any">Flug egal</option>
            <option value="without">ohne Flug</option>
            <option value="with">mit Flug</option>
          </select>
        </div>
        <div class="row chips" id="cabin-chips" aria-label="Kabinenarten">
          <!-- cabin checkboxes injected -->
        </div>
        <div class="row">
          <button type="submit">Filtern</button>
          <button type="reset" class="ghost">Zurücksetzen</button>
        </div>
      </form>
      <p id="status-line" class="muted"></p>
      <ul id="cruise-list" class="cards"></ul>
    </section>

    <section id="view-routes" hidden>
      <form id="route-filters" class="filters">
        <div class="row">
          <input type="search" name="q" placeholder="Route durchsuchen (Region, Schiff, Hafen)…" />
          <select name="ship"><option value="">Alle Schiffe</option></select>
          <select name="destination"><option value="">Alle Regionen</option></select>
          <select name="flight">
            <option value="any">Flug egal</option>
            <option value="without">ohne Flug</option>
            <option value="with">mit Flug</option>
          </select>
        </div>
        <div class="row">
          <button type="submit">Filtern</button>
          <button type="reset" class="ghost">Zurücksetzen</button>
        </div>
      </form>
      <p id="route-status" class="muted"></p>
      <ul id="route-list" class="cards"></ul>
    </section>

    <section id="view-route-detail" hidden>
      <p><button id="route-back" class="link">← zurück zur Routenübersicht</button></p>
      <div id="route-detail-body"></div>
    </section>

    <section id="view-promotions" hidden>
      <form id="promo-filters" class="filters">
        <div class="row">
          <select name="ship"><option value="">Alle Schiffe</option></select>
          <select name="destination"><option value="">Alle Regionen</option></select>
          <select name="flight">
            <option value="any">Flug egal</option>
            <option value="without">ohne Flug</option>
            <option value="with">mit Flug</option>
          </select>
        </div>
        <div class="row chips" id="promo-cabin-chips" aria-label="Kabinenarten"></div>
        <div class="row">
          <button type="submit">Filtern</button>
          <button type="reset" class="ghost">Zurücksetzen</button>
        </div>
      </form>
      <p id="promo-status" class="muted"></p>
      <ul id="promo-list" class="cards"></ul>
    </section>

    <section id="view-watchlist" hidden>
      <form id="watchlist-form" class="watchlist-form">
        <label>Deine E-Mail-Adresse:
          <input type="email" name="email" required placeholder="du@example.com" />
        </label>
        <button type="submit">Merkliste anzeigen</button>
      </form>
      <ul id="watchlist-list" class="cards"></ul>
    </section>
  </main>

  <dialog id="watch-dialog">
    <form method="dialog" id="watch-form">
      <h3 id="watch-title">Reise merken</h3>
      <p id="watch-subtitle" class="muted"></p>

      <fieldset>
        <legend>Welche Kabinenarten sollen wir beobachten?</legend>
        <div class="chips" id="watch-cabin-chips"><!-- injected --></div>
      </fieldset>

      <fieldset>
        <legend>Mit Flug?</legend>
        <label class="inline"><input type="radio" name="flightOption" value="any" checked> egal</label>
        <label class="inline"><input type="radio" name="flightOption" value="without"> ohne Flug</label>
        <label class="inline"><input type="radio" name="flightOption" value="with"> mit Flug</label>
      </fieldset>

      <label>Deine E-Mail:
        <input type="email" name="email" required placeholder="du@example.com" />
      </label>
      <p class="muted small">Du erhältst eine E-Mail, sobald der Preis innerhalb deiner Auswahl günstiger wird. Abmelden geht jederzeit per Link in jeder Mail.</p>

      <menu>
        <button value="cancel" type="reset">Abbrechen</button>
        <button id="watch-submit" value="default">Merken</button>
      </menu>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
