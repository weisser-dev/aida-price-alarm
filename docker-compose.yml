services:
  aida-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aida-price-alarm
    container_name: aida-price-alarm
    restart: unless-stopped
    # Kein Host-Port-Mapping: Caddy spricht den Container intern über
    # caddy-net an. Für lokale Tests in einer docker-compose.override.yml
    # ergänzen.
    expose:
      - "${APP_PORT:-3000}"
    environment:
      PORT: ${APP_PORT:-3000}
      APP_BASE_URL: ${APP_BASE_URL:-}
      DATABASE_PATH: /app/data/aida.db
      SCRAPE_CRON: ${SCRAPE_CRON:-15 6 * * *}
      USE_MOCK: ${USE_MOCK:-true}
      AIDA_API_URL: ${AIDA_API_URL:-}
      AIDA_USER_AGENT: ${AIDA_USER_AGENT:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-AIDA Preisalarm <noreply@example.com>}
    volumes:
      - ./data:/app/data
    networks:
      - aida-net
      - caddy-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT:-3000}/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  aida-net:
    driver: bridge
  caddy-net:
    external: true
